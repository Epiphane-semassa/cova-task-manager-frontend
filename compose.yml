services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-manager-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nw-cova-task-manager

networks:
  nw-cova-task-manager:
    external: true